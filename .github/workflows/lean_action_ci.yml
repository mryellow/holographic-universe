name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      # ROADMAP M0.3: the README ledger, the docs and the Lean sources stay in sync.
      # Runs after lean-action, which fetches the Mathlib sources the script searches.
      - name: Check the assumption ledger
        run: python3 scripts/check_ledger.py
      # ROADMAP M8.4: the numerical code agrees with the golden values proved in Golden.lean.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the numerical code against the golden values
        run: |
          python3 -m pip install --quiet numpy scipy
          python3 phenomenology/tests/test_golden.py
      - uses: leanprover-community/docgen-action@v1
